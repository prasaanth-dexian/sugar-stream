[package]
name = "thin-pi-system"
version = "0.1.0"
description = "THIN PI — Industrial Thin-Client Telemetry System"
authors = ["THIN PI"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri Desktop Shell ─────────────────────────────
tauri = { version = "2", features = [] }

# ── Serialization ───────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Embedded Database (SQLite WAL) ──────────────────
rusqlite = { version = "0.32", features = ["bundled"] }

# ── Cryptographic Licensing ─────────────────────────
ed25519-dalek = { version = "2", features = ["std"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# ── Hardware Fingerprint ────────────────────────────
machine-uid = "0.5"

# ── Async Runtime & Concurrency ─────────────────────
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
parking_lot = "0.12"

# ── HTTP Client (Cloud Sync) ───────────────────────
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
flate2 = "1"

# ── Utilities ───────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
log = "0.4"
env_logger = "0.11"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
